<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج أونلاين - SpyGame</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --panel-bg: #fff;
            --border-color: #ddd;
            --board-light: #f0d9b5;
            --board-dark: #b58863;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --panel-bg: #16213e;
            --border-color: #0f3460;
        }

        .white-1e1d7 { background-color: var(--board-light) !important; color: var(--board-dark) !important; }
        .black-3c85d { background-color: var(--board-dark) !important; color: var(--board-light) !important; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 800px; width: 100%; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 16px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background-color: #45a049; }
        .btn-secondary { background-color: #0f3460; }
        .btn-secondary:hover { background-color: #1a1a2e; }
        .btn-info { background-color: #17a2b8; }
        .btn-info:hover { background-color: #138496; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-warning:hover { background-color: #e0a800; }

        .form-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 15px; }

        #game-area { display: none; }
        .board-container { width: 100%; max-width: 500px; margin: 0 auto; position: relative; }

        .status-box {
            text-align: center; font-size: 1.2em; font-weight: bold; margin: 15px 0; padding: 10px;
            background: rgba(0,0,0,0.05); border-radius: 8px;
        }

        .spectators-box {
            text-align: center; font-size: 1em; margin: 15px 0; padding: 10px;
            background: rgba(23, 162, 184, 0.1); border-radius: 8px; border: 1px dashed #17a2b8;
        }

        .settings-bar { display: flex; justify-content: space-around; flex-wrap: wrap; margin-top: 15px; gap: 10px; }

        .legal-move-hint {
            position: absolute; width: 30%; height: 30%;
            background: rgba(0, 0, 0, 0.25); border-radius: 50%;
            top: 35%; left: 35%; pointer-events: none; z-index: 10;
        }
        body.dark-mode .legal-move-hint { background: rgba(255, 255, 255, 0.4); }

        .spectator-badge {
            background: #ff9800; color: white; padding: 5px 10px;
            border-radius: 5px; font-size: 0.9em; display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>شطرنج أونلاين ♟️</h2>
        <div>
            <button id="muteBtn" class="btn-secondary">🔊 شغال</button>
            <button id="themeToggle" class="btn-secondary">تبديل الوضع</button>
        </div>
    </div>

    <!-- شاشة اللوبي -->
    <div id="lobby-area" class="panel">
        <h3>إعدادات اللاعب</h3>
        <div class="form-group">
            <input type="text" id="playerName" placeholder="اسمك إيه؟" required>
            <select id="playerColor">
                <option value="w">أبيض</option>
                <option value="b">أسود</option>
            </select>
        </div>
        
        <hr style="border-color: var(--border-color); margin: 20px 0;">
        
        <h3>إنشاء أو الانضمام لغرفة</h3>
        <div class="form-group">
            <button id="createRoomBtn">إنشاء غرفة جديدة</button>
        </div>
        <div class="form-group">
            <input type="text" id="roomIdInput" placeholder="كود الغرفة">
            <button id="joinRoomBtn" class="btn-secondary">انضمام أو مشاهدة</button>
        </div>
        <p id="lobbyMessage" style="color: red;"></p>
    </div>

    <!-- شاشة اللعب -->
    <div id="game-area" class="panel">
        <div class="header" style="margin-bottom: 0;">
            <div>
                <h3>غرفة: <span id="displayRoomId"></span></h3>
                <span id="spectatorBadge" class="spectator-badge">👀 وضع المشاهدة</span>
            </div>
            <div>
                <button id="shareBtn" class="btn-info">🔗 نسخ الرابط</button>
                <button id="resignBtn" class="btn-warning" style="display: none;">🏳️ انسحاب</button>
                <button id="leaveRoomBtn" style="background-color: #dc3545;">خروج</button>
            </div>
        </div>
        
        <div class="status-box" id="gameStatus">في انتظار الخصم...</div>
        
        <div class="board-container">
            <div id="board"></div>
        </div>

        <!-- صندوق المشاهدين -->
        <div id="spectatorsBox" class="spectators-box" style="display: none;">
            👀 المشاهدين الآن (<span id="spectatorsCount">0</span>): <br>
            <strong id="spectatorsList" style="color: #17a2b8;"></strong>
        </div>

        <div class="settings-bar">
            <div>
                <label>شكل الرقعة:</label>
                <select id="boardTheme">
                    <option value="wood">خشبي كلاسيك</option>
                    <option value="blue">أزرق وأبيض</option>
                    <option value="green">أخضر شطرنج.كوم</option>
                    <option value="purple">بنفسجي مودرن</option>
                    <option value="bw">أبيض وأسود</option>
                    <option value="sand">رملي</option>
                    <option value="neon">نيون داكن</option>
                    <option value="mint">نعناعي</option>
                </select>
            </div>
            <div>
                <label>شكل القطع:</label>
                <select id="pieceTheme">
                    <option value="wikipedia">كلاسيك (Wikipedia)</option>
                    <option value="alpha">ألفا (Alpha)</option>
                    <option value="uscf">بطولات (USCF)</option>
                    <option value="neo">نيو (Neo)</option>
                    <option value="glass">زجاجي (Glass)</option>
                    <option value="gothic">قوطي (Gothic)</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBtIkF-UhkeFa-cxutgJAQpR7K_IjKxloc",
        authDomain: "spygame-337ee.firebaseapp.com",
        databaseURL: "https://spygame-337ee-default-rtdb.firebaseio.com", 
        projectId: "spygame-337ee",
        storageBucket: "spygame-337ee.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let board = null;
    let game = new Chess();
    let currentRoomId = null;
    let myColor = 'w';
    let myName = '';
    let dbRef = null;
    let isSpectator = false;
    let mySpectatorId = null; // لتخزين الـ ID بتاع المشاهد عشان نعرف نحذفه
    let roomPlayers = {}; 
    let gameEndedByResign = false;

    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    if (roomFromUrl) {
        $('#roomIdInput').val(roomFromUrl);
    }

    const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
    const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');
    let isMuted = false;

    $('#muteBtn').click(function() {
        isMuted = !isMuted;
        $(this).text(isMuted ? '🔇 مكتوم' : '🔊 شغال');
    });

    function playSound(isCapture) {
        if (isMuted) return;
        if (isCapture) captureSound.play().catch(e => {});
        else moveSound.play().catch(e => {});
    }

    $('#themeToggle').click(() => $('body').toggleClass('dark-mode'));

    const boardColors = {
        wood: { light: '#f0d9b5', dark: '#b58863' },
        blue: { light: '#dee3e6', dark: '#8ca2ad' },
        green: { light: '#ffffdd', dark: '#86a666' },
        purple: { light: '#9f90b0', dark: '#5c4d7d' },
        bw: { light: '#ffffff', dark: '#888888' },
        sand: { light: '#e6dabc', dark: '#8b4513' },
        neon: { light: '#222222', dark: '#39ff14' },
        mint: { light: '#f5fffa', dark: '#98ff98' }
    };

    $('#boardTheme').change(function() {
        const theme = boardColors[this.value];
        document.documentElement.style.setProperty('--board-light', theme.light);
        document.documentElement.style.setProperty('--board-dark', theme.dark);
    });

    $('#pieceTheme').change(function() {
        if(board) {
            const fen = game.fen();
            board.destroy(); 
            initBoard(); 
            board.position(fen);
        }
    });

    function getPieceImg(piece) {
        const theme = $('#pieceTheme').val();
        if (['wikipedia', 'alpha', 'uscf'].includes(theme)) {
            return 'https://chessboardjs.com/img/chesspieces/' + theme + '/' + piece + '.png';
        } else {
            return 'https://images.chesscomfiles.com/chess-themes/pieces/' + theme + '/150/' + piece.toLowerCase() + '.png';
        }
    }

    $('#createRoomBtn').click(() => {
        myName = $('#playerName').val().trim();
        myColor = $('#playerColor').val();
        if(!myName) return $('#lobbyMessage').text('لازم تكتب اسمك الأول!');

        currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        dbRef = db.ref('rooms/' + currentRoomId);
        dbRef.set({ fen: 'start', players: { [myColor]: myName }, turn: 'w' });
        
        // حذف اللاعب لو قفل المتصفح فجأة
        dbRef.child('players/' + myColor).onDisconnect().remove();

        enterGameRoom();
    });

    $('#joinRoomBtn').click(() => {
        myName = $('#playerName').val().trim();
        const roomId = $('#roomIdInput').val().trim().toUpperCase();
        if(!myName || !roomId) return $('#lobbyMessage').text('اكتب اسمك وكود الغرفة!');

        db.ref('rooms/' + roomId).once('value').then(snapshot => {
            if(snapshot.exists()) {
                const roomData = snapshot.val();
                currentRoomId = roomId;
                dbRef = db.ref('rooms/' + currentRoomId);
                
                if (!roomData.players || !roomData.players.w) {
                    myColor = 'w';
                } else if (!roomData.players.b) {
                    myColor = 'b';
                } else {
                    isSpectator = true; 
                }

                if (!isSpectator) {
                    dbRef.child('players').update({ [myColor]: myName });
                    dbRef.child('players/' + myColor).onDisconnect().remove();
                } else {
                    // تسجيل المشاهد
                    mySpectatorId = dbRef.child('spectators').push().key;
                    dbRef.child('spectators/' + mySpectatorId).set(myName);
                    dbRef.child('spectators/' + mySpectatorId).onDisconnect().remove();
                }
                
                enterGameRoom();
            } else {
                $('#lobbyMessage').text('الغرفة دي مش موجودة!');
            }
        });
    });

    $('#resignBtn').click(() => {
        if (isSpectator || game.game_over() || gameEndedByResign) return;
        if (confirm('هل أنت متأكد إنك عايز تنسحب وتنهي الجيم؟ 🏳️')) {
            const winnerColor = myColor === 'w' ? 'b' : 'w';
            dbRef.update({
                gameOverByResign: true,
                winnerColor: winnerColor,
                loserName: myName
            });
        }
    });

    $('#shareBtn').click(function() {
        const shareUrl = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
        navigator.clipboard.writeText(shareUrl).then(() => {
            const originalText = $(this).text();
            $(this).text('✅ تم النسخ!');
            setTimeout(() => $(this).text(originalText), 2000);
        });
    });

    $('#leaveRoomBtn').click(() => {
        if(dbRef) {
            if (!isSpectator) {
                dbRef.child('players/' + myColor).remove();
            } else if (mySpectatorId) {
                dbRef.child('spectators/' + mySpectatorId).remove();
            }
        }
        window.history.pushState({}, '', window.location.pathname); 
        location.reload(); 
    });

    function enterGameRoom() {
        $('#lobby-area').hide();
        $('#game-area').show();
        $('#displayRoomId').text(currentRoomId);
        window.history.pushState({}, '', '?room=' + currentRoomId);

        if (isSpectator) {
            $('#spectatorBadge').show();
        } else {
            $('#resignBtn').show(); 
        }

        initBoard();
        listenToFirebase();
    }

    function removeLegalMoveHints() {
        $('#board .legal-move-hint').remove();
    }

    function initBoard() {
        const config = {
            draggable: !isSpectator, 
            position: 'start',
            orientation: (myColor === 'b') ? 'black' : 'white',
            pieceTheme: getPieceImg,
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        board = Chessboard('board', config);
        $(window).resize(board.resize);
    }

    function onDragStart(source, piece, position, orientation) {
        if (isSpectator || game.game_over() || gameEndedByResign) return false;
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1) ||
            (game.turn() !== myColor)) {
            return false;
        }

        const moves = game.moves({ square: source, verbose: true });
        if (moves.length === 0) return;

        for (let i = 0; i < moves.length; i++) {
            const squareEl = $('#board .square-' + moves[i].to);
            squareEl.append('<div class="legal-move-hint"></div>');
        }
    }

    function onDrop(source, target) {
        removeLegalMoveHints(); 

        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        playSound(move.captured != null); 
        
        dbRef.update({
            fen: game.fen(),
            turn: game.turn(),
            lastMoveWasCapture: move.captured != null
        });
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    function listenToFirebase() {
        dbRef.on('value', snapshot => {
            const data = snapshot.val();
            if(!data) return;

            if (data.players) {
                roomPlayers = data.players;
            }

            // تحديث قايمة المشاهدين
            if (data.spectators) {
                const spectatorNames = Object.values(data.spectators);
                if (spectatorNames.length > 0) {
                    $('#spectatorsBox').show();
                    $('#spectatorsCount').text(spectatorNames.length);
                    $('#spectatorsList').text(spectatorNames.join(' ، '));
                } else {
                    $('#spectatorsBox').hide();
                }
            } else {
                $('#spectatorsBox').hide();
            }

            if (data.gameOverByResign) {
                gameEndedByResign = true;
                const winColor = data.winnerColor;
                const winnerName = roomPlayers[winColor] || (winColor === 'w' ? 'الأبيض' : 'الأسود');
                $('#gameStatus').html(`🏳️ انسحب اللاعب <b>${data.loserName}</b>.<br>🏆 الفائز هو: <b>${winnerName}</b>! الجيم انتهى.`);
                return;
            }

            if(data.fen !== game.fen()) {
                playSound(data.lastMoveWasCapture);
                game.load(data.fen);
                board.position(game.fen());
            }
            updateStatus();
        });
    }

    function updateStatus() {
        if (gameEndedByResign) return;
        
        let statusText = '';
        let turnColor = game.turn();
        
        let currentTurnName = roomPlayers[turnColor] || (turnColor === 'w' ? 'الأبيض' : 'الأسود');
        let opponentColor = turnColor === 'w' ? 'b' : 'w';
        let opponentName = roomPlayers[opponentColor] || (opponentColor === 'w' ? 'الأبيض' : 'الأسود');

        if (game.in_checkmate()) {
            statusText = `كش مات! اللاعب <b>${opponentName}</b> فاز بالجيم! 🏆`;
        } else if (game.in_draw()) {
            statusText = 'انتهت المباراة بالتعادل!';
        } else {
            statusText = `دور اللاعب: <b>${currentTurnName}</b>`;
            if (game.in_check()) statusText += ' (كش ملك! ⚠️)';
        }
        $('#gameStatus').html(statusText);
    }
</script>

</body>
</html>
