<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج أونلاين - SpyGame</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* إعدادات الألوان المتغيرة (الوضع الفاتح والداكن وألوان الرقعة) */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --panel-bg: #fff;
            --border-color: #ddd;
            
            /* ألوان الرقعة الافتراضية */
            --board-light: #f0d9b5;
            --board-dark: #b58863;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --panel-bg: #16213e;
            --border-color: #0f3460;
        }

        /* تعديل ألوان مربعات الرقعة بناءً على المتغيرات */
        .white-1e1d7 { background-color: var(--board-light) !important; color: var(--board-dark) !important; }
        .black-3c85d { background-color: var(--board-dark) !important; color: var(--board-light) !important; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 16px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background-color: #45a049; }
        
        .btn-secondary { background-color: #0f3460; }
        .btn-secondary:hover { background-color: #1a1a2e; }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        #game-area { display: none; }
        
        .board-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .status-box {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .settings-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 15px;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>شطرنج أونلاين ♟️</h2>
        <button id="themeToggle" class="btn-secondary">تبديل الوضع (Dark/Light)</button>
    </div>

    <div id="lobby-area" class="panel">
        <h3>إعدادات اللاعب</h3>
        <div class="form-group">
            <input type="text" id="playerName" placeholder="اسمك إيه؟" required>
            <select id="playerColor">
                <option value="w">أبيض</option>
                <option value="b">أسود</option>
            </select>
        </div>
        
        <hr style="border-color: var(--border-color); margin: 20px 0;">
        
        <h3>إنشاء أو الانضمام لغرفة</h3>
        <div class="form-group">
            <button id="createRoomBtn">إنشاء غرفة جديدة</button>
        </div>
        <div class="form-group">
            <input type="text" id="roomIdInput" placeholder="كود الغرفة">
            <button id="joinRoomBtn" class="btn-secondary">انضمام</button>
        </div>
        <p id="lobbyMessage" style="color: red;"></p>
    </div>

    <div id="game-area" class="panel">
        <div class="header" style="margin-bottom: 0;">
            <h3>غرفة: <span id="displayRoomId"></span></h3>
            <button id="leaveRoomBtn" style="background-color: #dc3545;">خروج</button>
        </div>
        
        <div class="status-box" id="gameStatus">في انتظار الخصم...</div>
        
        <div class="board-container">
            <div id="board"></div>
        </div>

        <div class="settings-bar">
            <div>
                <label>شكل الرقعة:</label>
                <select id="boardTheme">
                    <option value="wood">خشبي كلاسيك</option>
                    <option value="blue">أزرق وأبيض</option>
                    <option value="green">أخضر شطرنج.كوم</option>
                    <option value="purple">بنفسجي مودرن</option>
                </select>
            </div>
            <div>
                <label>شكل القطع:</label>
                <select id="pieceTheme">
                    <option value="wikipedia">كلاسيك (Wikipedia)</option>
                    <option value="alpha">ألفا (Alpha)</option>
                    <option value="uscf">بطولات (USCF)</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyBtIkF-UhkeFa-cxutgJAQpR7K_IjKxloc",
        authDomain: "spygame-337ee.firebaseapp.com",
        databaseURL: "https://spygame-337ee-default-rtdb.firebaseio.com", 
        projectId: "spygame-337ee",
        storageBucket: "spygame-337ee.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // متغيرات اللعبة
    let board = null;
    let game = new Chess();
    let currentRoomId = null;
    let myColor = 'w';
    let myName = '';
    let dbRef = null;

    // 2. إعدادات الـ UI والدارك مود
    $('#themeToggle').click(() => {
        $('body').toggleClass('dark-mode');
    });

    // تغيير ألوان الرقعة
    const boardColors = {
        wood: { light: '#f0d9b5', dark: '#b58863' },
        blue: { light: '#dee3e6', dark: '#8ca2ad' },
        green: { light: '#ffffdd', dark: '#86a666' },
        purple: { light: '#9f90b0', dark: '#5c4d7d' }
    };

    $('#boardTheme').change(function() {
        const theme = boardColors[this.value];
        document.documentElement.style.setProperty('--board-light', theme.light);
        document.documentElement.style.setProperty('--board-dark', theme.dark);
    });

    // تغيير شكل القطع
    $('#pieceTheme').change(function() {
        if(board) {
            const pieceStyle = this.value;
            const fen = game.fen();
            board.destroy(); // تدمير الرقعة القديمة
            initBoard(pieceStyle); // إنشاء رقعة جديدة بالشكل الجديد
            board.position(fen);
        }
    });

    // 3. اللوجيك الخاص بإنشاء والانضمام للغرفة
    $('#createRoomBtn').click(() => {
        myName = $('#playerName').val().trim();
        myColor = $('#playerColor').val();
        if(!myName) return $('#lobbyMessage').text('لازم تكتب اسمك الأول!');

        currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        
        dbRef = db.ref('rooms/' + currentRoomId);
        dbRef.set({
            fen: 'start',
            players: {
                [myColor]: myName
            },
            turn: 'w'
        });

        enterGameRoom();
    });

    $('#joinRoomBtn').click(() => {
        myName = $('#playerName').val().trim();
        const roomId = $('#roomIdInput').val().trim().toUpperCase();
        if(!myName || !roomId) return $('#lobbyMessage').text('اكتب اسمك وكود الغرفة صح!');

        db.ref('rooms/' + roomId).once('value').then(snapshot => {
            if(snapshot.exists()) {
                const roomData = snapshot.val();
                currentRoomId = roomId;
                dbRef = db.ref('rooms/' + currentRoomId);
                
                // تحديد اللون المتبقي للضيف
                myColor = roomData.players.w ? 'b' : 'w';
                
                dbRef.child('players').update({ [myColor]: myName });
                enterGameRoom();
            } else {
                $('#lobbyMessage').text('الغرفة دي مش موجودة!');
            }
        });
    });

    $('#leaveRoomBtn').click(() => {
        if(dbRef) {
            dbRef.child('players/' + myColor).remove();
            dbRef.off(); // إيقاف الاستماع للتحديثات
        }
        location.reload(); // أسهل طريقة لتنظيف الحالة والرجوع للوبي
    });

    // 4. الدخول لغرفة اللعب
    function enterGameRoom() {
        $('#lobby-area').hide();
        $('#game-area').show();
        $('#displayRoomId').text(currentRoomId);
        
        initBoard($('#pieceTheme').val());
        listenToFirebase();
    }

    // 5. تهيئة رقعة الشطرنج
    function initBoard(pieceStyle) {
        const config = {
            draggable: true,
            position: 'start',
            orientation: myColor === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/' + pieceStyle + '/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        board = Chessboard('board', config);
        $(window).resize(board.resize);
    }

    // 6. قوانين الحركة والتحكم (Chess.js)
    function onDragStart(source, piece, position, orientation) {
        if (game.game_over()) return false;
        // منع اللاعب من تحريك قطع الخصم أو اللعب في غير دوره
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1) ||
            (game.turn() !== myColor)) {
            return false;
        }
    }

    function onDrop(source, target) {
        // محاولة الحركة
        const move = game.move({
            from: source,
            to: target,
            promotion: 'q' // دائماً ترقية لوزير للتبسيط
        });

        // إذا كانت الحركة غير قانونية، رجع القطعة مكانها
        if (move === null) return 'snapback';

        // تحديث الفايربيز بالحركة الجديدة
        updateStatus();
        dbRef.update({
            fen: game.fen(),
            turn: game.turn()
        });
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    // 7. الاستماع لتحديثات الخصم من Firebase
    function listenToFirebase() {
        dbRef.on('value', snapshot => {
            const data = snapshot.val();
            if(!data) return;

            // تحديث الرقعة إذا كانت الحركة جاية من الخصم
            if(data.fen !== game.fen()) {
                game.load(data.fen);
                board.position(game.fen());
            }
            
            updateStatus(data.players);
        });
    }

    // 8. تحديث حالة اللعبة (نصوص الشاشة)
    function updateStatus(playersData = null) {
        let statusText = '';
        let moveColor = game.turn() === 'w' ? 'الأبيض' : 'الأسود';

        if (game.in_checkmate()) {
            statusText = `كش مات! اللاعب ${moveColor === 'الأبيض' ? 'الأسود' : 'الأبيض'} فاز! 🏆`;
        } else if (game.in_draw()) {
            statusText = 'تعادل!';
        } else {
            statusText = `دور اللاعب: ${moveColor}`;
            if (game.in_check()) {
                statusText += ' (كش ملك! ⚠️)';
            }
        }
        $('#gameStatus').text(statusText);
    }
</script>

</body>
</html>
